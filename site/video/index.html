<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ClipViet · Video</title>
<style>
:root{color-scheme:dark;background:#08090d;color:#f5f5f5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;padding:24px 14px}main{max-width:1100px;margin:auto}a{color:#ff9aa2}h1{font-size:clamp(30px,7vw,56px)}p{color:#999;font-size:12px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{border:1px solid #30313a;background:#101116;padding:14px}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#050505}.card h2{font-size:15px}.card button{border:1px solid #ef3340;background:#ef3340;color:#fff;padding:10px;border-radius:0;font:700 11px ui-monospace,monospace}.status{border-left:2px solid #ef3340;padding:10px 14px}.player{width:100%;max-height:70vh;background:#000;margin:14px 0}
</style></head><body><main><p>CLIPVIET / VIDEO LIBRARY</p><h1>Video <span style="color:#ef3340">Library</span></h1><p class="status" id="status">Đang tải video đã được duyệt…</p><video id="player" class="player" controls playsinline hidden></video><div class="grid" id="videos"></div></main>
<script type="module">
const status=document.querySelector("#status"),root=document.querySelector("#videos"),player=document.querySelector("#player");
try{const response=await fetch("/api/videos",{cache:"no-store"});if(!response.ok)throw new Error("API HTTP "+response.status);const payload=await response.json(),items=Array.isArray(payload.data)?payload.data:[];status.textContent=items.length+" video đã xuất bản.";
for(const item of items){const card=document.createElement("article");card.className="card";if(item.posterUrl){const img=document.createElement("img");img.src=item.posterUrl;img.alt=item.title;img.loading="lazy";card.append(img)}const title=document.createElement("h2");title.textContent=item.title;card.append(title);const desc=document.createElement("p");desc.textContent=item.description||"";card.append(desc);const tags=document.createElement("p");tags.textContent=(item.tags||[]).join(" · ");card.append(tags);const button=document.createElement("button");button.textContent="PHÁT VIDEO";button.disabled=!item.videoUrl;button.addEventListener("click",()=>{player.src=item.videoUrl;player.hidden=false;player.load();player.play().catch(()=>{});player.scrollIntoView({behavior:"smooth",block:"center"})});card.append(button);root.append(card)}
if(!items.length)status.textContent="Chưa có video được duyệt và xuất bản. Video mới sẽ xuất hiện sau khi Admin xác minh quyền phân phối.";
}catch(e){status.textContent="Không thể tải video: "+e.message}
</script></body></html>
