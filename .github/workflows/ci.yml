name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]

permissions:
  contents: read

jobs:
  static-site:
    name: Static website (site/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static website boundary
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/data.js
          test -s site/admin/index.html
          test -s site/admin/admin.js
          test -s scripts/sync-pages-catalog.mjs
          test "$(cat site/CNAME)" = "clipviet.live"
          test ! -e site/package.json
          echo "Static website is self-contained in site/."
      - name: Verify rights-gated catalog defaults
        run: |
          env -u CATALOG_DISTRIBUTION_AUTHORIZED node scripts/sync-pages-catalog.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('site/data/catalog.json', 'utf8'));
          if (!Array.isArray(catalog.providers) || catalog.providers.length !== 5) throw new Error('expected exactly five providers');
          if (catalog.providers.some(provider => provider.status !== 'PENDING' || provider.rightsStatus !== 'PENDING')) throw new Error('provider rights state must remain PENDING');
          if (!Array.isArray(catalog.videos) || catalog.videos.length !== 0) throw new Error('unlicensed video records must not enter the public catalog');
          if (catalog.providers.some(provider => (provider.mediaHosts || []).length !== 0)) throw new Error('media allowlists must remain empty');
          console.log('PASS: five providers PENDING; zero public videos; empty media allowlists.');
          NODE
      - name: Check all static JavaScript modules
        run: |
          node --input-type=module --check < scripts/sync-pages-catalog.mjs
          node --input-type=module --check < scripts/ingest-apify-review.mjs
          node --input-type=module --check < scripts/build-approved-apify-catalog.mjs
          node --input-type=module --check < apify/video-list-crawler/src/main.js
          node --input-type=module --check < apify/video-list-crawler/src/routes.js
          node --input-type=module --check < apify/video-list-crawler/src/robots.js
          node -e "JSON.parse(require('fs').readFileSync('apify/video-list-crawler/.actor/actor.json')); JSON.parse(require('fs').readFileSync('apify/video-list-crawler/.actor/input_schema.json')); JSON.parse(require('fs').readFileSync('apify/video-list-crawler/package.json'));"
          node --input-type=module --check < workers/provider-registry/src/index.mjs
          node --input-type=module --check < workers/provider-registry/src/security.mjs
          node --input-type=module --check < workers/provider-registry/src/auth.mjs
          node --input-type=module --check < workers/provider-registry/src/rights-gate.mjs
          node --input-type=module --check < workers/provider-registry/src/rights-entry.mjs
          node --input-type=module --check < workers/provider-registry/src/diagnostics.mjs
          node --input-type=module --check < workers/provider-registry/src/admin-ui.mjs
          find site -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

  nextjs:
    name: Next.js app and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint Next.js app and shared server code
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build Next.js application
        run: npm run build

  php-lint:
    name: PHP API syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Check PHP syntax
        run: find php-api -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
