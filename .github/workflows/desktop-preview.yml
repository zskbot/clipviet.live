name: Desktop Preview Checks
on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check src/app.js
      - name: Validate Electron package metadata
        run: node -e "const p=require('./package.json'); if(p.main!=='src/main.cjs'||!p.build||!p.build.linux||!p.build.win||!p.build.mac) process.exit(1); console.log(p.name, p.version)"
