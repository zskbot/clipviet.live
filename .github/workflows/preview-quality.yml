name: Preview Quality Gate

on:
  push:
    branches:
      - "preview/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-quality:
    name: Lint, tests, static links and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run all Node checks and preserve diagnostic logs
        id: checks
        shell: bash
        run: |
          set +e
          mkdir -p qa-logs
          failed=0
          echo "## Preview Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Exit code |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          run_check() {
            name="$1"
            shift
            log="qa-logs/$name.log"
            echo "===== $name ====="
            "$@" > "$log" 2>&1
            status=$?
            cat "$log"
            echo "| $name | $status |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          }

          run_check npm-ci npm ci --no-audit --no-fund
          run_check lint npm run lint
          run_check unit-tests npm test
          run_check static-site-audit node scripts/audit-static-site.mjs
          run_check javascript-syntax bash -c '
            set -euo pipefail
            for root in site app lib scripts worker workers; do
              [[ -d "$root" ]] || continue
              while IFS= read -r -d "" file; do
                echo "Checking $file"
                node --input-type=module --check < "$file"
              done < <(find "$root" -type f \( -name "*.js" -o -name "*.mjs" \) -print0)
            done
          '
          run_check next-build npm run build

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: Upload Node diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-quality-node-logs-${{ github.run_id }}
          path: qa-logs/
          if-no-files-found: warn
          retention-days: 7

  php-quality:
    name: PHP API syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        id: setup-php
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Check PHP syntax and preserve diagnostics
        shell: bash
        run: |
          mkdir -p qa-logs
          if ! command -v php >/dev/null 2>&1; then
            echo "PHP runtime unavailable after setup-php." | tee qa-logs/php-lint.log
            exit 1
          fi
          php -v | tee qa-logs/php-version.log
          if [[ -d php-api ]]; then
            find php-api -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l 2>&1 | tee qa-logs/php-lint.log
          else
            echo "No php-api directory in this repository." | tee qa-logs/php-lint.log
          fi

      - name: Upload PHP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-quality-php-logs-${{ github.run_id }}
          path: qa-logs/
          if-no-files-found: warn
          retention-days: 7
