name: Provider rights Preview checks

on:
  pull_request:
    paths:
      - "lib/maccms-provider.mjs"
      - "tests/maccms-provider.test.mjs"
      - "workers/provider-registry/migrations/**"
      - "tests/provider-registry-rights-migration.test.mjs"
      - ".github/workflows/provider-rights-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check adapter syntax
        run: node --check lib/maccms-provider.mjs
      - name: Run provider adapter and rights migration tests
        run: node --test tests/maccms-provider.test.mjs tests/provider-registry-rights-migration.test.mjs
