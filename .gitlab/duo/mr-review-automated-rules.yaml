Configure custom review instructions for an instance

On GitLab Self-Managed and GitLab Dedicated, you can define instance-wide custom review instructions by specifying a project to use as a template. The template project must contain a .gitlab/duo/mr-review-instructions.yaml file with review instructions that apply to every project on the instance.

When GitLab Duo performs a code review, it combines instance instructions with the group and project instructions.

Prerequisites:

Administrator access for the instance.

A project on the instance contains the custom review instructions that you want to use as a template.

Do not store sensitive or confidential information in mr-review-instructions.yaml. Any user who can view a merge request on the instance can access instance review instructions, even if they do not have access to the project that contains the file.

To configure custom review instructions for an instance:

In the upper-right corner, select Admin.
In the left sidebar, select GitLab Duo.
Select Change configuration.
Under Customize code review, select the project that contains the .gitlab/duo/mr-review-instructions.yaml file with your review instructions.
Select Save changes.
Reference files in instructions

You can reference other files in custom instructions instead of duplicating content. Code Review Flow reads the referenced files during the pre-scan step and extracts relevant guidance.

Custom instructions support two file reference patterns:

Files in the same project as the merge request: Use a repository-relative path, such as docs/security-checklist.md.
Files in other projects on the same GitLab instance: Use a full GitLab blob URL, such as https://gitlab.example.com/group/project/-/blob/main/docs/style-guide.md. The URL must point to the same GitLab instance as the merge request and must use the /-/blob/<ref>/<path> format.
For example:

yaml

instructions:
  - name: Database Migrations
    fileFilters:
      - "db/migrate/**/*.rb"
    instructions: |
      1. Follow the migration guidelines in
         https://gitlab.com/gitlab-org/gitlab/-/blob/master/doc/development/database/avoiding_downtime_in_migrations.md
      2. Reference the team checklist in docs/db-checklist.md
Limitations of file references

File reference resolution has the following constraints:

Same GitLab instance only. URLs that point to a different GitLab instance, to public GitLab from a GitLab Self-Managed instance, or to any non-GitLab site, such as Confluence or a public documentation site, are not fetched.
Blob URLs only, formatted as /-/blob/<ref>/<path>. Wiki pages, issues, raw URLs, and snippets are not fetched.
Same project for bare paths. A bare path such as docs/security.md resolves against the same project as the merge request. Use a full GitLab blob URL to reference a file in a different project.
Best effort, not guaranteed. Code Review Flow decides which references to fetch based on the instruction text. A reference that fails to resolve, such as a path that does not exist or a URL the parser rejects, is skipped silently.
Code Review Flow uses a summary, not the original file. It summarizes the fetched content during the pre-scan step and uses the summary during the review. Two reviews of the same merge request can produce different summaries.
If you want Code Review Flow to use the exact file contents and not a summary, include it directly in the instructions: field instead of referencing the file. Inline instructions are used as written.

Best practices

When writing custom review instructions:

Be specific and actionable. Code Review Flow checks each rule against the diff. For example, a concrete rule like “verify that public methods have YARD documentation” produces useful comments, but abstract guidance like “document your code well” does not.
Number your instructions for clarity.
Focus on the most important standards. Every rule’s text becomes part of the review prompt, so long lists of low-value rules inflate the prompt without adding signal.
Explain the “why” when helpful.
Start with straightforward instructions, and add complexity as needed.
Focus on project-specific standards that Code Review Flow wouldn’t apply by default. Custom instructions add to the standard review criteria instead of replacing them. General advice like “add error handling” or “use meaningful names” is usually already covered. Use custom instructions for what only your project knows: internal APIs, architectural conventions, domain-specific patterns.
Write instructions as guidance, not mandates. Instructions are hints that shape review behavior, not policies that GitLab Duo is required to follow. Avoid wording like “always flag” or “never allow”. This phrasing can mislead collaborators into thinking the behavior is guaranteed.
Make file patterns reflect the actual scope of the rule. Code Review Flow reads each instruction alongside each fileFilters reference and applies the rule only to files that match those patterns. For example, a rule for “Rails controllers” scoped to **/*.rb will apply to gems, scripts, and tests, not just controllers. Use app/controllers/**/*.rb instead.
Only use external file references for instructions where exact wording does not matter, otherwise include the details as a rule in the instructions: field directly. Code Review Flow generates and uses summaries for referenced files, but uses the exact wording defined in instructions.
For example:

yaml

instructions: |
  1. All public functions must include docstrings with parameter descriptions
  2. Use parameterized queries to prevent SQL injection
  3. Validate user input before processing (check type, length, format)
  4. Include error handling for all external API calls
  5. Avoid hardcoded credentials - use environment variables
For language-specific examples, see the use case examples.

File pattern reference

Use glob patterns in fileFilters to target specific files.

For example, for a project that contains Ruby files:

Pattern	Match
**/*.rb	All Ruby files in any directory
*.rb	Ruby files in root directory only
lib/**/*.rb	Ruby files in the lib directory and its subdirectories
!**/*.test.rb	Exclude all Ruby test files
!spec/**/*.rb	Exclude all Ruby files in the spec directory and its subdirectories
!tests/**/*	Exclude all files in the tests directory and its subdirectories
**/*.{js,jsx}	JavaScript and JSX files in all directories (GitLab 19.1 and later)
The following example shows the difference between **/*.rb and *.rb:

project/
├── app.rb              ← matched by both *.rb and **/*.rb
├── lib/
│   └── helper.rb       ← matched only by **/*.rb
└── app/
    └── models/
        └── user.rb     ← matched only by **/*.rb
*.rb would only match app.rb
**/*.rb would match all three files
For the mr-review-instructions.yaml file, **/*.rb ensures that review instructions apply to Ruby files anywhere in the project structure, not just the root directory.

Use case examples

yaml

instructions:
  - name: Assembly Style Guide
    fileFilters:
      - "**/*.asm"
      - "**/*.s"
      - "**/*.S"
    instructions: |
      1. Document the target architecture (x86-64, ARM, RISC-V, AVR, etc.) at the top
      2. Use meaningful labels and comment all non-obvious instructions
      3. Document register usage and calling conventions
      4. Align code sections properly for readability
      5. Include memory layout and stack usage documentation
