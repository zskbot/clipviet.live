name: Provider rights Preview checks

on:
  pull_request:
    paths:
      - "lib/maccms-provider.mjs"
      - "tests/maccms-provider.test.mjs"
      - "workers/provider-registry/migrations/**"
      - "tests/provider-registry-rights-migration.test.mjs"
      - "scripts/import-licensed-catalog.mjs"
      - "tests/licensed-catalog-import.test.mjs"
      - "scripts/normalize-source-intake.mjs"
      - "tests/source-intake-normalizer.test.mjs"
      - ".github/workflows/provider-rights-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check adapter and intake syntax
        run: |
          node --check lib/maccms-provider.mjs
          node --check scripts/normalize-source-intake.mjs
      - name: Run provider, rights, licensed import, and source intake tests
        run: node --test tests/maccms-provider.test.mjs tests/provider-registry-rights-migration.test.mjs tests/licensed-catalog-import.test.mjs tests/source-intake-normalizer.test.mjs
