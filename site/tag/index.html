<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClipViet Tags</title>
<style>
:root{color-scheme:dark;background:#08090d;color:#f5f5f5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;padding:28px 16px}main{max-width:1100px;margin:auto}h1{font-size:clamp(30px,7vw,56px)}p{color:#aaa;font-size:12px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.tag{border:1px solid #30313a;padding:14px;color:#eee;background:#101116}.tag small{display:block;color:#999;margin-top:8px}.status{border-left:2px solid #ef3340;padding:10px 14px}
</style></head><body><main><p>CLIPVIET / CATALOG</p><h1>Tags & danh mục</h1><p class="status" id="status">Đang tải metadata từ Cloudflare Preview API…</p><div class="grid" id="tags"></div></main>
<script type="module">
const status=document.querySelector("#status"),root=document.querySelector("#tags");
try{
 const r=await fetch("/api/catalog/categories",{headers:{accept:"application/json"},cache:"no-store"});
 if(!r.ok)throw new Error("API trả HTTP "+r.status);
 const payload=await r.json(),items=Array.isArray(payload.data)?payload.data:[];
 status.textContent=items.length+" danh mục được trả về từ "+(payload.sourceId||"Preview API")+".";
 for(const item of items){
  const name=String(item.type_name||item.name||item.title||"Danh mục").slice(0,100);
  const id=String(item.type_id??item.id??"");
  const el=document.createElement("a");el.className="tag";el.href="/video/?categoryId="+encodeURIComponent(id);
  const strong=document.createElement("strong");strong.textContent=name;
  const small=document.createElement("small");small.textContent=id?"ID "+id:"CATEGORY";
  el.append(strong,small);root.append(el);
 }
 if(!items.length)status.textContent="Chưa có danh mục trong phản hồi API Preview.";
}catch(e){status.textContent="Không thể tải tags: "+e.message;}
</script></body></html>
