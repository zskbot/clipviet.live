name: ClipViet Telegram Worker checks

on:
  pull_request:
    paths:
      - "worker/telegram-api/**"
      - ".github/workflows/clipviet-platform-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Telegram Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find worker/telegram-api -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --input-type=module --check < "$file"
            done
      - name: Run AppleCMS adapter unit tests
        run: npm --prefix worker/telegram-api run test:providers
      - name: Verify required adapter contract
        run: |
          set -eu
          test -s worker/telegram-api/src/index.js
          test -s worker/telegram-api/src/applecms.js
          test -s worker/telegram-api/src/applecms.test.mjs
          grep -q 'APPLECMS_SOUAVZY_URL' worker/telegram-api/src/applecms.js
      - name: Scan for committed secrets
        run: |
          ! grep -R -nE '([0-9]{6,}:[A-Za-z0-9_-]{30,}|TELEGRAM_BOT_TOKEN=.{8,}|SESSION_SECRET=.{8,})' worker/telegram-api
