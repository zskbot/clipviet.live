name: CI via GitLab (manual relay)

on:
  # GitLab runs Preview CI directly on its own runner. This relay is retained
  # for an explicit manual dispatch only; it is not a required Preview gate.
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact GitHub commit SHA
        required: false
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  gitlab:
    name: Manual GitLab CI relay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITLAB_PROJECT_ID: "89474932"
      GITLAB_REF: "ci/github-gitlab-bridge"
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
    steps:
      - name: Validate relay configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$GITLAB_API_TOKEN" ]] || {
            echo "Set GITLAB_API_TOKEN before manually running this optional relay."
            exit 1
          }
          echo "Configuration valid. GitLab Preview pipelines remain independently runnable."
