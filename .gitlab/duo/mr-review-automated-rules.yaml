Create custom review instructions to provide standards for GitLab Duo to reference when reviewing merge requests.

For example, you can guide GitLab Duo to focus on Ruby style conventions for Ruby files, and Go style conventions for Go files.

Custom review instructions are guidance for the AI reviewer, not enforced policies. GitLab Duo uses them as context to shape its review, but cannot guarantee every instruction is applied in every case. Do not rely on custom instructions for security controls, compliance obligations, or other requirements where consistent enforcement is needed.

GitLab Duo appends your custom review instructions to its standard review criteria, instead of replacing them.

Code Review Flow supports custom review instructions for a project, group, or instance.

Configure custom review instructions for a project

To configure custom merge request review instructions:

In the root of your repository, create a .gitlab/duo directory if one doesn’t already exist.

In the .gitlab/duo directory, create a file named mr-review-instructions.yaml.

Add your custom instructions using the following format:

yaml

instructions:
  - name: <instruction_group_name>
    fileFilters:
      - <glob_pattern_1>
      - <glob_pattern_2>
      - !<exclude_pattern>  # Exclude files matching this pattern
    instructions: |
      <your_custom_review_instructions>
The fileFilters section is optional. Use glob patterns in this section to target the instruction to specific files. If you omit fileFilters or leave it empty, GitLab Duo applies the instruction to every file in the merge request.

For example:

yaml

instructions:
  - name: Ruby Style Guide
    fileFilters:
      - "*.rb"           # Ruby files in the root directory
      - "lib/**/*.rb"    # Ruby files in lib and its subdirectories
      - "!spec/**/*.rb"  # Exclude test files
    instructions: |
      1. Ensure all methods have proper documentation
      2. Follow Ruby style guide conventions
      3. Prefer symbols over strings for hash keys

  - name: TypeScript Source Files
    fileFilters:
      - "**/*.ts"        # Typescript files in any directory
      - "!**/*.test.ts"  # Exclude test files
      - "!**/*.spec.ts"  # Exclude spec files
    instructions: |
      1. Ensure proper TypeScript types (avoid 'any')
      2. Follow naming conventions
      3. Document complex functions

  - name: All Files Except Tests
    fileFilters:
      - "!**/*.test.*"   # Exclude all test files
      - "!**/*.spec.*"   # Exclude all spec files
      - "!test/**/*"     # Exclude test directories
      - "!spec/**/*"     # Exclude spec directories
    instructions: |
      1. Follow consistent code style
      2. Add meaningful comments for complex logic
      3. Ensure proper error handling

  - name: Test Coverage
    fileFilters:
      - "spec/**/*_spec.rb" # Ruby test files in spec directory
    instructions: |
      1. Test both happy paths and edge cases
      2. Include error scenarios
      3. Use shared examples to reduce duplication

  - name: Database Migrations
    fileFilters:
      - "db/migrate/**/*.rb"
      - "db/post_migrate/**/*.rb"
    instructions: |
      1. Follow the migration safety guidelines in
         https://gitlab.com/gitlab-org/gitlab/-/blob/master/doc/development/database/avoiding_downtime_in_migrations.md
      2. Apply the team checklist in docs/migrations-checklist.md

  - name: All Files
    fileFilters:
      - "**/*"   # All files in the repository
    instructions: |
      1. Explain the "why" behind each suggestion
For details about referencing files in instructions, see reference files in instructions.

For glob syntax examples, see the file pattern reference.

Optional: Add a Code Owners entry to protect changes to the mr-review-instructions.yaml file.

markdown

[GitLab Duo]
.gitlab/duo @default-owner @tech-lead
Create a merge request to review and merge the changes:

GitLab Duo automatically applies your custom instructions when the file patterns match.

Multiple instruction groups can apply to a single file. When a file matches the fileFilters of more than one group, Code Review Flow applies the instructions from every matching group.

For review comments triggered by your custom instructions, GitLab Duo uses this format:

According to custom instructions in '[instruction_name]': [feedback comments]
The instruction_name value corresponds to the name property from your .gitlab/duo/mr-review-instructions.yaml file. Standard GitLab Duo comments do not use this format.

If GitLab Duo does not find any issues, it leaves a review summary comment. Custom instructions do not apply to this summary comment.

Optional:

Review the feedback and refine your instructions as needed.
Test the patterns to ensure they match the intended files.
Configure custom review instructions for a group

You can define custom review instructions for a group by specifying a project to use as a template. The template project must contain a .gitlab/duo/mr-review-instructions.yaml file with review instructions that apply to all projects in the group and its subgroups.

When GitLab Duo performs a code review, it combines instructions from the top-level group with instructions defined in the individual project.

If you already configured a project to store automatic review exclusion rules for your group, store your mr-review-instructions.yaml in the same project. You can only specify a single project to customize code review for a group, so GitLab automatically checks that project for review instructions as well. You do not need to follow the steps below again.

Prerequisites:

The Owner role for the top-level group.

A project in the group contains the custom review instructions that you want to use as a template.

Do not store sensitive or confidential information in mr-review-instructions.yaml. Any user who can view a merge request in the group can access group review instructions, even if they do not have access to the project that contains the file.

