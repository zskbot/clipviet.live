name: ClipViet GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/sync-pages-catalog.mjs"
      - "scripts/discover-video-sources.mjs"
      - "scripts/build-approved-apify-catalog.mjs"
      - "data/apify-rights-approved.json"
      - "data/video-provider-discovery.json"
      - ".github/workflows/deploy-clipviet-pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pages_per_provider:
        description: "Số trang catalog tối đa lấy từ mỗi nguồn (1-50)"
        required: false
        default: "20"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clipviet-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Discover official providers, sync catalog and publish site/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover official provider documentation
        run: node scripts/discover-video-sources.mjs

      - name: Build static catalog from configured AppleCMS providers
        env:
          CATALOG_PAGES_PER_PROVIDER: ${{ inputs.pages_per_provider || '20' }}
        run: node scripts/sync-pages-catalog.mjs

      - name: Merge only human-approved Apify records into public catalog
        run: node scripts/build-approved-apify-catalog.mjs

      - name: Validate generated catalogue, discovery report and static pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('site/data/catalog.json', 'utf8'));
          const discovery = JSON.parse(fs.readFileSync('site/data/provider-discovery.json', 'utf8'));
          if (!Array.isArray(catalog.videos)) throw new Error('catalog.videos must be an array');
          if (!Array.isArray(catalog.providers) || catalog.providers.length !== 5) throw new Error('expected exactly five provider registry records');
          if (catalog.providers.some(provider => provider.status !== 'PENDING' || provider.rightsStatus !== 'PENDING')) throw new Error('all five providers must remain PENDING until rights evidence is reviewed');
          if (catalog.videos.length > 0) throw new Error('public AppleCMS catalog must remain empty while all providers are PENDING');
          if (!Array.isArray(catalog.crawlerVideos)) throw new Error('catalog.crawlerVideos must be an array');
          if (catalog.crawlerVideos.some(video => video.rightsStatus !== 'APPROVED' || !video.rightsEvidenceUrl || !video.reviewedBy || !video.reviewedAt)) throw new Error('unapproved crawler record found in public catalog');
          if (!Array.isArray(discovery.results) || discovery.results.length < 1) throw new Error('provider discovery report is missing');
          console.log('Validated five PENDING providers and', catalog.videos.length, 'public videos; discovered', discovery.results.length, 'official provider documentation candidates.');
          NODE
          test -s site/index.html
          test -s site/browse/index.html
          test -s site/watch/source.html
          test -s site/watch/source-player.js
          test -s site/data/catalog.json
          test -s site/data/provider-discovery.json
          test "$(cat site/CNAME)" = "clipviet.live"
          find site -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            while IFS= read -r -d '' file; do
              node --input-type=module --check < "$file"
            done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
