<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClipViet Tags</title>
<style>:root{color-scheme:dark;background:#08090d;color:#f5f5f5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;padding:28px 16px}main{max-width:1100px;margin:auto}h1{font-size:clamp(30px,7vw,56px)}p{color:#aaa;font-size:12px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.tag{border:1px solid #30313a;padding:14px;color:#eee;background:#101116}.tag small{display:block;color:#999;margin-top:8px}.status{border-left:2px solid #ef3340;padding:10px 14px}</style></head>
<body><main><p>CLIPVIET / CATALOG</p><h1>Tags</h1><p class="status" id="status">Đang tải tags đã xuất bản…</p><div class="grid" id="tags"></div></main>
<script type="module">const status=document.querySelector("#status"),root=document.querySelector("#tags");try{const r=await fetch("/api/tags",{cache:"no-store"});if(!r.ok)throw new Error("API HTTP "+r.status);const p=await r.json(),items=Array.isArray(p.data)?p.data:[];status.textContent=items.length+" tags công khai.";for(const item of items){const a=document.createElement("a");a.className="tag";a.href="/video/?tag="+encodeURIComponent(item.name);const b=document.createElement("strong");b.textContent=item.name;const s=document.createElement("small");s.textContent=item.count+" VIDEO";a.append(b,s);root.append(a)}if(!items.length)status.textContent="Chưa có tag vì chưa có video được duyệt xuất bản."}catch(e){status.textContent="Không tải được tags: "+e.message}</script></body></html>
