name: Apify crawler review import

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Apify dataset ID to import into the private review artifact
        required: true
        default: "b2fEjQCqLoak61WwS"
        type: string

permissions:
  contents: write

concurrency:
  group: clipviet-apify-review
  cancel-in-progress: false

jobs:
  import-review-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and normalize Apify dataset (review-only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_DATASET_ID: ${{ inputs.dataset_id }}
        run: node scripts/ingest-apify-review.mjs
      - name: Persist deduplication index on the selected branch
        run: |
          if git diff --quiet -- data/apify-crawler-index.json; then
            echo "Deduplication index unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/apify-crawler-index.json
            git commit -m "chore(crawler): update persistent deduplication index"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipviet-apify-review-${{ inputs.dataset_id }}
          path: artifacts/apify-crawler-review.json
          retention-days: 14
          if-no-files-found: error
